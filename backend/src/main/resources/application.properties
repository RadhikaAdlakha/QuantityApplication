# =========================================================
# APPLICATION NAME
# =========================================================

spring.application.name=quantity-measurement-app


# =========================================================
# H2 DATABASE CONFIGURATION
# =========================================================

spring.datasource.url=jdbc:h2:mem:quantitydb;DB_CLOSE_DELAY=-1

spring.datasource.driverClassName=org.h2.Driver

spring.datasource.username=sa

spring.datasource.password=

repository.type=database

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false


# =========================================================
# JDBC CONNECTION POOL (HIKARI CP)
# =========================================================

spring.datasource.hikari.maximum-pool-size=10

spring.datasource.hikari.minimum-idle=2

spring.datasource.hikari.idle-timeout=30000

spring.datasource.hikari.connection-timeout=20000

spring.datasource.hikari.max-lifetime=1800000


# =========================================================
# CUSTOM CONNECTION POOL CONFIGURATION
# =========================================================

pool.initialSize=5

pool.maxSize=10

pool.timeout=5000


# =========================================================
# H2 CONSOLE
# =========================================================

spring.h2.console.enabled=true

spring.h2.console.path=/h2-console


# =========================================================
# SQL INITIALIZATION
# =========================================================

spring.sql.init.mode=always

spring.sql.init.schema-locations=classpath:db/schema.sql


# =========================================================
# LOGGING CONFIGURATION
# =========================================================

logging.level.root=INFO

logging.level.com.quantity.measurement=DEBUG

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# =========================================================
# JPA LOGGING (OPTIONAL)
# =========================================================

spring.jpa.show-sql=true
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
server.port=8080
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true

# \u2500\u2500\u2500 Google OAuth2 \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google

# \u2500\u2500\u2500 JWT \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500
# Must be 32+ characters. Change this before going to production!
app.jwt.secret=${JWT_SECRET}
# 86400000 ms = 24 hours
app.jwt.expiration=86400000