# =========================================================
# APPLICATION NAME
# =========================================================
spring.application.name=quantity-measurement-app


# =========================================================
# SERVER (RENDER REQUIRED)
# =========================================================
server.port=${PORT:8080}


# =========================================================
# H2 DATABASE CONFIGURATION (RENDER SAFE - FILE MODE)
# =========================================================
spring.datasource.url=${DB_URL}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

repository.type=database

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false


# =========================================================
# JDBC CONNECTION POOL (HIKARI CP)
# =========================================================
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000


# =========================================================
# CUSTOM CONNECTION POOL CONFIGURATION
# =========================================================
pool.initialSize=5
pool.maxSize=10
pool.timeout=5000


# =========================================================
# H2 CONSOLE (OPTIONAL - FOR DEMO ONLY)
# =========================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# =========================================================
# SQL INITIALIZATION
# (KEEP ONLY IF schema.sql EXISTS)
# =========================================================
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql


# =========================================================
# LOGGING CONFIGURATION
# =========================================================
logging.level.root=INFO
logging.level.com.quantity.measurement=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n


# =========================================================
# SPRINGDOC (API DOCS)
# =========================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.enabled=true


# =========================================================
# GOOGLE OAUTH2 (SECURE VIA ENV VARIABLES)
# =========================================================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/google


# =========================================================
# JWT CONFIGURATION (SECURE VIA ENV VARIABLES)
# =========================================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration=86400000